[project]
name = "orbit-air-baggage-desk"
version = "0.1.0"
description = "Command line baggage claims desk for Orbit Air (SQLite + Python)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
